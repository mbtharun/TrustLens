<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrustLens</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }

        h1 {
            margin-bottom: 4px;
        }

        .sub {
            color: #555;
            margin-top: 0;
        }

        .box {
            border: 2px dashed #aaa;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
        }

        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 16px;
            display: none;
        }

        .bar {
            background: #eee;
            border-radius: 6px;
            height: 22px;
            overflow: hidden;
            margin: 12px 0 4px;
        }

        #fill {
            background: #4a7bd8;
            height: 100%;
            width: 0;
            transition: width 0.4s;
        }

        .note {
            background: #fff7e0;
            border-left: 4px solid #e0a800;
            padding: 10px 12px;
            font-size: 14px;
            margin-top: 16px;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>
    <h1>TrustLens</h1>
    <p class="sub">Scores how likely an image is to be AI-generated.</p>

    <div class="box">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
        <br>
        <img id="preview" alt="Selected image preview">
    </div>

    <div id="result" hidden>
        <p><strong>AI likelihood score:</strong> <span id="score"></span></p>
        <div class="bar">
            <div id="fill"></div>
        </div>
        <p id="error" class="error"></p>
    </div>

    <div class="note">
        This is a ranking score, not a verdict. In testing on real photos, about 40% were flagged as AI,
        so do not use this result to decide whether an image is real.
    </div>

    <script>
        const API = "http://127.0.0.1:8000/analyze";
        const fileInput = document.getElementById("file");
        const preview = document.getElementById("preview");
        const result = document.getElementById("result");
        const score = document.getElementById("score");
        const fill = document.getElementById("fill");
        const errorBox = document.getElementById("error");

        fileInput.addEventListener("change", async () => {
            const file = fileInput.files[0];
            if (!file) return;

            preview.src = URL.createObjectURL(file);
            preview.style.display = "inline-block";
            result.hidden = false;
            score.textContent = "analyzing...";
            fill.style.width = "0%";
            errorBox.textContent = "";

            const form = new FormData();
            form.append("file", file);

            try {
                const res = await fetch(API, { method: "POST", body: form });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Request failed");
                const pct = (data.probability_ai * 100).toFixed(1);
                score.textContent = `${pct}%`;
                fill.style.width = `${pct}%`;
            } catch (e) {
                score.textContent = "";
                errorBox.textContent = `Could not get a score: ${e.message}`;
            }
        });
    </script>
</body>

</html>
